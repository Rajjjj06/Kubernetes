<!doctype html>
<html>
  <head>
    <title>Environment Variables</title>
  </head>
  {% for name in data %}
  <p>{{ name }}</p>
  {% endfor %}
  <body>
    <h1>Environment Variables</h1>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Value</th>
      </tr>

      {% for key, value in env.items() %}
      <tr>
        <td>{{ key }}</td>
        <td>{{ value }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
