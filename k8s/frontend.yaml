apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenrir-frontend-deployment
spec:
  selector:
    matchLabels:
      app: fenrir-frontend
  template:
    metadata:
      labels:
        app: fenrir-frontend
    spec:
      containers:
        - name: fenrir-frontend-container
          image: docker.io/drizzy0606/assignment1:frontend-v1
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://fenrir-backend-service.python-full.svc.cluster.local
            - name: tree
              value: "oak"
